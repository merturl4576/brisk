# The 674 tests used to run on exactly one machine: Mert's. That is not a
# proof, it is an anecdote — a test that has never run anywhere else cannot
# tell you whether it is testing brisk or testing this desktop.
#
# Windows runners only, and that is not a limitation to apologise for: brisk
# reads the Windows registry, WMI, the Windows event log and hardware sensors.
# There is nothing here that could honestly be exercised on Linux.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build + test (windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore brisk.sln

      # TreatWarningsAsErrors is already on in every project, so a warning
      # fails this step. That is deliberate: the count of warnings brisk
      # tolerates is zero, and a number nobody enforces drifts.
      - name: Build (Release)
        run: dotnet build brisk.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test brisk.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      # Uploaded on failure too — a red run whose only evidence is a truncated
      # console log makes you re-run it to learn anything.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
